name: WasmRL CI

on:
  push:
    branches: [ "main", "feature/wasmrl-*" ]
    paths:
      - 'wasmrl/**'
      - '.github/workflows/wasmrl.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'wasmrl/**'
      - '.github/workflows/wasmrl.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Rust license headers
      shell: bash
      run: |
        set -euo pipefail
        bash ./scripts/copyright.sh
        if git diff --name-only -- 'wasmrl/**/*.rs' | grep -q .; then
          echo "The following WasmRL Rust files are missing license headers:" >&2
          git diff --name-only -- 'wasmrl/**/*.rs' >&2
          echo "Please run ./scripts/copyright.sh locally and commit the changes." >&2
          exit 1
        fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy
    - run: rustup toolchain install nightly --component rustfmt
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasmrl -> target
    - name: Check formatting
      run: cargo +nightly fmt --all --manifest-path wasmrl/Cargo.toml -- --check
    - name: Run Clippy
      run: cargo clippy --manifest-path wasmrl/Cargo.toml --workspace --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: rustup target add wasm32-wasip2
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasmrl -> target
    - name: Build WasmRL workspace
      run: cargo build --manifest-path wasmrl/Cargo.toml --workspace
    - name: Build Wasm environments
      run: |
        cd wasmrl
        cargo build --target wasm32-wasip2 -p counter-env
        cargo build --target wasm32-wasip2 -p malicious-loop-env
        cargo build --target wasm32-wasip2 -p malicious-memory-env
        cargo build --target wasm32-wasip2 -p reset-heavy-env

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: rustup target add wasm32-wasip2
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasmrl -> target
    - name: Build Wasm components for tests
      run: |
        cd wasmrl
        cargo build --target wasm32-wasip2 -p counter-env --release
        cargo build --target wasm32-wasip2 -p malicious-loop-env --release
        cargo build --target wasm32-wasip2 -p malicious-memory-env --release
        cargo build --target wasm32-wasip2 -p reset-heavy-env --release
    - name: Run all tests
      run: cargo test --manifest-path wasmrl/Cargo.toml --workspace --verbose
    - name: Run integration tests
      run: |
        cd wasmrl
        cargo test --test integration_test --verbose
        cargo test --test determinism_test --verbose
        cargo test --test m3_runtime_test --verbose
        cargo test --test m4_fast_reset_test --verbose
        cargo test --test m5_policy_test --verbose
        cargo test --test m6_python_test --verbose
        cargo test --test m7_benchmark_test --verbose
        cargo test --test m8_mcp_bridge_test --verbose
        cargo test --test m9_comparison_test --verbose

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasmrl -> target
    - name: Build docs
      run: cargo doc --manifest-path wasmrl/Cargo.toml --workspace --no-deps
      env:
        RUSTDOCFLAGS: -D warnings

  # Python bindings test (requires maturin)
  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: rustup target add wasm32-wasip2
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasmrl -> target
    - name: Install maturin
      run: pip install maturin numpy
    - name: Build Python wheel
      run: |
        cd wasmrl/crates/wasmrl-py
        maturin build --release
    - name: Test Python import
      run: |
        pip install wasmrl/target/wheels/*.whl
        python -c "import wasmrl_py; print('WasmRL Python bindings loaded successfully')"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [license-headers, lint, build, test, doc, python]
    if: always()
    steps:
    - name: Check status
      run: |
        echo "## WasmRL CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| License Headers | ${{ needs.license-headers.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation | ${{ needs.doc.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
