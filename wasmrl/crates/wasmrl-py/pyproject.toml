[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "wasmrl_py"
version = "0.1.0"
description = "Python bindings for WasmRL - WebAssembly Runtime for RL Environments"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Microsoft" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["reinforcement-learning", "webassembly", "wasm", "gymnasium", "vecenv"]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "maturin>=1.4",
]
training = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "torch>=2.0",
]

[project.urls]
Repository = "https://github.com/microsoft/wassette"
Documentation = "https://github.com/microsoft/wassette/tree/main/wasmrl"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "wasmrl_py"
